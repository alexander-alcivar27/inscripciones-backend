<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Lidera Manabí</title>

  <link rel="stylesheet" href="css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="js/admin.js" defer></script>
</head>

<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h2>Acceso Administrador</h2>
      <p>Panel de administración · Lidera Manabí</p>

      <div id="loginError" class="login-error"></div>

      <div class="field">
        <label>Usuario</label>
        <input id="inputUsuario" type="text" placeholder="Ingrese su usuario"
          onkeydown="if(event.key==='Enter')hacerLogin()">
      </div>

      <div class="field">
        <label>Contraseña</label>

        <div class="password-box">

          <input id="inputPassword" type="password" placeholder="Ingrese su contraseña"
            onkeydown="if(event.key==='Enter')hacerLogin()">

          <button type="button" class="toggle-password" onclick="togglePassword()">
            👁
          </button>

        </div>
      </div>

      <button type="submit" id="btnLogin" class="login-btn" onclick="hacerLogin()">

        ↪ Ingresar

      </button>
    </div>
  </div>

  <aside class="sidebar app-screen">
    <div class="brand">
      <img src="./img/logo_on.png" class="brand-logo" alt="ModoON">

      <div class="brand-title">
        <span>Lidera</span>
        <strong>Manabí</strong>
      </div>
    </div>

    <nav>
      <button class="nav-btn active" onclick="mostrarVista('dashboard')">
        <span>📊</span> Dashboard
      </button>

      <button class="nav-btn" onclick="mostrarVista('preinscripciones')">
        <span>👥</span> Preinscripciones
      </button>

      <button class="nav-btn" onclick="mostrarVista('cohortes')">
        <span>🎓</span> Cohortes
      </button>

      <button class="nav-btn" onclick="mostrarVista('seguimiento')">
        <span>📈</span> Seguimiento de avance
      </button>

      <button class="nav-btn" onclick="mostrarVista('correos')">
        <span>✉️</span> Correos enviados
      </button>

      <button class="nav-btn" onclick="mostrarVista('configuracion')">
        <span>⚙️</span> Configuración
      </button>
    </nav>
  </aside>

  <main class="main app-screen">

    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Panel de administración · Lidera Manabí</p>
      </div>

      <div class="admin-actions">
        <div class="admin-chip">
          👤 <span id="adminNombre">Administrador</span>
        </div>

        <button class="btn-logout" onclick="cerrarSesion()">
          ↪ Cerrar sesión
        </button>
      </div>
    </header>

    <section id="viewContainer">
      <p>Cargando...</p>
    </section>

  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)cerrarModal()">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Detalle</h3>
        <button class="modal-close" onclick="cerrarModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <div id="globalLoader" class="global-loader">

    <div class="loader-card">

      <div class="spinner"></div>

      <h3 id="loaderTitle">
        Procesando...
      </h3>

      <p id="loaderMessage">
        Espera un momento
      </p>

    </div>

  </div>

</body>

</html>
